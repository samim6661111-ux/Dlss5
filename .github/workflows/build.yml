name: build-libfoxpostfx
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate Android NDK
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK=$NDK" >> "$GITHUB_ENV"

      - name: Compile shaders
        run: |
          GLSLC=$(find "$NDK/shader-tools" -name glslc -type f | head -1)
          GLSLC="$GLSLC" sh gen_spv.sh

      # Dobby does not build for Android arm64 at any recent revision.
      # And64InlineHook is a tiny arm64 inline-hook lib (1 .cpp file).
      # We wrap it so code that does #include "dobby.h" + DobbyHook(...) still compiles.
      - name: Hook library (And64InlineHook as dobby shim)
        run: |
          git clone --depth 1 https://github.com/Rprop/And64InlineHook.git a64
          mkdir -p third_party_dobby/include
          cp a64/And64InlineHook.cpp a64/And64InlineHook.hpp third_party_dobby/

          cat > third_party_dobby/include/dobby.h <<'EOF'
          #pragma once
          #include <dlfcn.h>
          #include <stdint.h>
          extern "C" void A64HookFunction(void *const symbol, void *const replace, void **result);
          typedef void (*dobby_dummy_func_t)(void);

          static inline int DobbyHook(void *address, void *replace_func, void **origin_func) {
            A64HookFunction(address, replace_func, origin_func);
            return 0;
          }
          static inline int DobbyHook(void *address, dobby_dummy_func_t replace_func, dobby_dummy_func_t *origin_func) {
            return DobbyHook(address, (void *)replace_func, (void **)origin_func);
          }
          static inline void *DobbySymbolResolver(const char *image_name, const char *symbol_name) {
            if (!image_name) return dlsym(RTLD_DEFAULT, symbol_name);
            void *h = dlopen(image_name, RTLD_NOW | RTLD_NOLOAD);
            if (!h) h = dlopen(image_name, RTLD_NOW);
            return h ? dlsym(h, symbol_name) : nullptr;
          }
          static inline int DobbyDestroy(void *) { return -1; }
          EOF

          cat > third_party_dobby/CMakeLists.txt <<'EOF'
          add_library(dobby STATIC And64InlineHook.cpp)
          set_target_properties(dobby PROPERTIES POSITION_INDEPENDENT_CODE ON)
          target_include_directories(dobby PUBLIC ${CMAKE_CURRENT_LIST_DIR}/include)
          target_link_libraries(dobby PUBLIC log)
          add_library(dobby_static ALIAS dobby)
          EOF

      - name: Configure
        run: |
          cmake -S . -B out \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DFETCHCONTENT_SOURCE_DIR_DOBBY="$PWD/third_party_dobby" \
            -DCMAKE_SHARED_LINKER_FLAGS="-Wl,-Bsymbolic"

      - name: Build
        run: cmake --build out -j"$(nproc)"

      - name: Collect library
        run: |
          mkdir -p dist
          find out -name libfoxpostfx.so -type f -exec cp {} dist/ \;
          cp foxpostfx.cfg dist/
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: libfoxpostfx
          path: dist/
