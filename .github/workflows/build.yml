name: build-libfoxpostfx
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate Android NDK
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK=$NDK" >> "$GITHUB_ENV"

      - name: Compile shaders
        run: |
          GLSLC=$(find "$NDK/shader-tools" -name glslc -type f | head -1)
          GLSLC="$GLSLC" sh gen_spv.sh

      - name: Fetch and patch Dobby
        run: |
          git clone --depth 1 https://github.com/jmpews/Dobby.git third_party_dobby
          for F in $(find third_party_dobby/source -path "*arm64*" -name "*.asm"); do
            sed -i -E \
              -e 's/([[:alnum:]_]+(\([[:alnum:]_]+\))?)@PAGEOFF/:lo12:\1/g' \
              -e 's/@PAGE//g' "$F"
          done
          grep -rn "lo12\|PAGE" third_party_dobby/source --include=*.asm || true
          sed -i 's/PRIVATE dobby log/PRIVATE dobby_static log/' CMakeLists.txt

      - name: Configure
        run: |
          cmake -S . -B out \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DFETCHCONTENT_SOURCE_DIR_DOBBY="$PWD/third_party_dobby" \
            -DCMAKE_SHARED_LINKER_FLAGS="-Wl,-Bsymbolic"

      - name: Build
        run: cmake --build out -j"$(nproc)"

      - name: Collect library
        run: |
          mkdir -p dist
          find out -name libfoxpostfx.so -type f -exec cp {} dist/ \;
          cp foxpostfx.cfg dist/
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: libfoxpostfx
          path: dist/
